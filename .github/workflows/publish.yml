name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A41C84: ${{ secrets.A41C84 }}
          B02284: ${{ secrets.B02284 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A41C84', '')
          env_b = os.environ.get('B02284', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 55c1c922966574b72c559573753f3a5c90832b -->', env_a)
          if env_b:
              result = result.replace('<!-- 26beb95196cd85144de5d394b0704da0fb16923ed315 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
